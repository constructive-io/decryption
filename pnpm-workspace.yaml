packages:
  - 'packages/*'
  - 'pgpm-modules/*'
  - 'apps/*'

# Managed by pnpm-policy — run `pnpm-policy generate` after editing pnpm-policy.yaml.

# A third-party release must be 2d old before it can be installed.
# Most malicious releases are found and yanked well inside that window.
minimumReleaseAge: 2880

# Exempt from the wait: 6 scope glob(s), 47 first-party package(s).
# First-party membership comes from what pyramation publishes on npm — waiting on your own release protects nothing.
minimumReleaseAgeExclude:
  - "@constructive-db/*"
  - "@constructive-io/*"
  - "@launchql/*"
  - "@pgpm/*"
  - "@pgpmjs/*"
  - "@pgsql/*"
  - 12factor-env
  - "@agentic-kit/ollama"
  - "@agentic-kit/protocol"
  - appstash
  - csv-to-pg
  - etag-hash
  - find-and-require-package-json
  - genomic
  - gql-ast
  - graphile-bucket-provisioner-plugin
  - graphile-bulk-mutations
  - graphile-cache
  - graphile-connection-filter
  - graphile-history
  - graphile-i18n
  - graphile-llm
  - graphile-ltree
  - graphile-meta
  - graphile-pg-aggregates
  - graphile-plugin-utils
  - graphile-postgis
  - graphile-presigned-url-plugin
  - graphile-realtime-subscriptions
  - graphile-search
  - graphile-settings
  - graphile-upload-plugin
  - inflekt
  - inquirerer
  - komoji
  - libpg-query
  - makage
  - mime-bytes
  - nested-obj
  - pg-cache
  - pg-env
  - pg-query-context
  - pg-seed
  - pglite-test
  - pgsql-client
  - pgsql-deparser
  - pgsql-parser
  - pgsql-seed
  - pgsql-test
  - pnpm-policy
  - uuid-hash
  - yamlize
  - yanse

# The only dependencies permitted to run install scripts.
allowBuilds:
  electron: true # postinstall downloads the platform-specific Electron binary that apps/desktop runs against; without it there is no Electron runtime to launch.
  esbuild: true # postinstall downloads/selects the correct platform-specific esbuild native binary used by the build toolchain; without it esbuild has no binary to invoke.
  nx: true # lerna's postinstall builds the Nx project graph and asserts native platform support for the workspace; skipping it leaves lerna's task graph uninitialized.
  unrs-resolver: true # postinstall (via napi-postinstall) downloads/selects the correct prebuilt native binary for the TypeScript resolver used by eslint; without it the resolver has no binary to load.

# Transitive dependencies must come from the registry, not from git or a URL.
blockExoticSubdeps: true
