name: CI

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.34.5

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22.x"
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    - name: Check supply-chain policy
      run: pnpm run policy:check

    - name: Build packages
      run: pnpm build

    - name: Lint
      run: pnpm lint

    - name: Run tests
      run: pnpm test
